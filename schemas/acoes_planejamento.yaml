          type: integer
          constraints: 
            enum: [0, 1]
        - name: Identificador de Ação Governamental IAG
          type: string
        - name: Código do Projeto Estratégico
          type: integer
        - name: Projeto Estratégico
          type: string
        - name: Exclusão Lógica da Ação
          type: string
        - name: Nova Ação
          type: string
        - name: Justificativa de Inclusão ou Exclusão da Ação
          type: string
        - name: Transferida para o SISOR
          type: string
        - name: Unidade Administrativa Responsável pela Ação
          type: string
        - name: Base legal
          type: string
        - name: Finalidade da Ação
          type: string
        - name: Descrição da Ação
          type: string
        - name: Código do Público-alvo
          type: integer
        - name: Público-Alvo
          type: string
        - name: Código do Produto
          type: integer
        - name: Produto
          type: string
          description: "Bem, serviço ou transferência financeira destinado ao público-alvo da ação. Para cada ação deve haver um só produto. Em situações especiais, o produto expressa a quantidade de beneficiários atendidos pela ação. Destaca-se que no âmbito das ações contínuas, cada categoria de produto final entregue pela unidade enseja a criação de uma ação correspondente no plano. Por regra, os produtos devem ser determinados, mensuráveis,  objetivos e gerencialmente úteis para o controle físico da ação."
        - name: Especificação do Produto
          type: string
        - name: Código da Unidade de Medida do Produto
