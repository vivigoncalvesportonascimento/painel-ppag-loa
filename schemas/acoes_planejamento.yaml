        - name: Unidade Orçamentária Responsável pelo Programa
          type: string
          description: "É a unidade orçamentária responsável pelo gerenciamento do programa. Vinculam-se aos programas multissetorias apenas uma Unidade Orçamentária Responsável pelo Programa."
        - name: Código da Unidade Orçamentária Responsável pela Ação
          type: integer
        - name: Unidade Orçamentária Responsável pela Ação
          type: string
        - name: Código da Função
          type: integer
        - name: Função
          type: string
          description: "De acordo com a Portaria Ministerial n. o 42/99, a função representa o maior nível de agregação das diversas áreas de despesa que competem ao setor público. Tem como objetivo consolidar em que áreas de atuação do setor público são gastos os recursos orçamentários, tendo como critério a natureza do objeto da ação. Portanto, visa a agregar ações que tenham objetos correlatos."
        - name: Código da Subfunção
          type: integer
        - name: Subfunção
          type: string
        - name: Código do Tipo de Ação
          type: integer
        - name: Tipo de Ação
          type: string
